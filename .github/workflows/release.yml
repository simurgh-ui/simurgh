name: Release

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify an already-published release without publishing again
        required: false
        type: boolean
        default: false

concurrency:
  group: simurgh-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:api-reports
      - run: pnpm test:release
      - run: pnpm test:release-notes
      - run: pnpm test:quick-starts
      - run: pnpm test:tarballs
      - run: pnpm bundle:size
      - if: ${{ !inputs.verify_only }}
        run: node scripts/check-registry-versions.mjs --publish
      - if: ${{ !inputs.verify_only }}
        run: pnpm release
        env:
          NPM_CONFIG_PROVENANCE: 'true'
      - run: node scripts/verify-published-beta.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: published-beta-evidence
          path: artifacts/published-beta-evidence.json
          if-no-files-found: error
