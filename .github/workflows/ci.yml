name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:release-notes
        env:
          CHANGESET_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
      - run: pnpm --filter @simurgh-ui/docs feedback
      - run: pnpm --filter @simurgh-ui/docs readiness
      - run: pnpm build
      - run: pnpm test:api-reports
      - run: pnpm test:references
      - run: pnpm test:quick-starts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --project=chromium --project=mobile-android
